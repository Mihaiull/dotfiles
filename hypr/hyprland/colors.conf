# exec = export SLURP_ARGS='-d -c ACB7BCBB -b 3E484D44 -s 00000000'

general {
    col.active_border = rgba(E3E2E339)
    col.inactive_border = rgba(8C929530)
}

misc {
    background_color = rgba(121414FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(121414FF)
        col.text = rgba(E3E2E3FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(E3E2E3), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(E3E2E3), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(E3E2E3), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(AECBD8AA) rgba(AECBD877),pinned:1